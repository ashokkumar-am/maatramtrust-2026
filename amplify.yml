version: 1
frontend:
  phases:
    preBuild:
      commands:
        # The Amplify build image ships Node but not pnpm; corepack activates
        # the version pinned in package.json's "packageManager" field.
        - corepack enable
        # Flat node_modules for this build only: Next loads mongodb/mongoose
        # via native require at runtime (serverExternalPackages), and pnpm's
        # symlink layout leaves their deps (bson, kareem) out of the deployed
        # SSR bundle. pnpm 11 ignores node-linker in .npmrc — the setting
        # must live in pnpm-workspace.yaml.
        - echo "nodeLinker: hoisted" >> pnpm-workspace.yaml
        - pnpm install --frozen-lockfile
    build:
      commands:
        # Pull the app env from Secrets Manager (maatramtrust/prod/app).
        # Requires the Amplify service role to allow secretsmanager:GetSecretValue
        # and AWS_REGION=ap-south-1. Writes .env.production.local, which
        # `next build` reads (NEXT_PUBLIC_* inlining) — copied to
        # .env.production so the SSR compute picks it up at runtime too.
        - node scripts/pull-env.mjs prod
        - cp .env.production.local .env.production
        - pnpm run build
  artifacts:
    baseDirectory: .next
    files:
      - "**/*"
  cache:
    paths:
      - .next/cache/**/*
